  .lang-switch {

  .lang-btn {

    font-size: 0.85rem;
    cursor: pointer;

  .lang-btn.active { background: var(--primary); border-color: var(--primary); color: white; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;

  h1 { font-size: 1.35rem; margin: 0 0 0.35rem; color: var(--primary-dark); }
  .subtitle { color: var(--muted); font-size: 0.92rem; margin: 0 0 1.5rem; }

  label { display: block; font-size: 0.88rem; color: var(--muted); margin-bottom: 1.1rem; }
  label .req { color: var(--danger); }
  select, textarea, input[type=text] {
    display: block;
    width: 100%;
    margin-top: 0.4rem;
    padding: 0.65rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text);
    background: white;
  }
  textarea { min-height: 120px; resize: vertical; }

  .btn-submit {
    width: 100%;
    padding: 0.85rem;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    font-size: 1.02rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-submit:hover { background: var(--primary-dark); }
  .btn-submit:disabled { opacity: 0.6; cursor: default; }

  .error-msg { color: var(--danger); font-size: 0.85rem; margin: -0.6rem 0 1rem; display: none; }
  .error-msg.show { display: block; }

  .success-card { display: none; text-align: center; }
  .success-card.show { display: block; }
  .success-card .check {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--success-bg); color: var(--success);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; margin: 0 auto 1rem;
  }
  .success-card h2 { color: var(--success); margin: 0 0 0.5rem; }
  .success-card p { color: var(--muted); margin: 0 0 1.5rem; }
  .link-btn {
    background: none; border: none; color: var(--primary);
    text-decoration: underline; cursor: pointer; font-size: 0.95rem;
  }

  html[dir="rtl"] .lang-switch { direction: rtl; }
</style>

let currentLang = localStorage.getItem('feedback_lang') || 'en';
if (!STRINGS[currentLang]) currentLang = 'en';

function applyLang(lang) {
  currentLang = lang;
  try { localStorage.setItem('feedback_lang', lang); } catch (e) {}
  const s = STRINGS[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = s.dir;
  document.querySelectorAll('[data-t]').forEach(el => {
    const key = el.getAttribute('data-t');
    if (s[key] !== undefined) el.textContent = s[key];
  });
  document.querySelectorAll('[data-t-ph]').forEach(el => {
    const key = el.getAttribute('data-t-ph');
    if (s[key] !== undefined) el.setAttribute('placeholder', s[key]);
  });
  document.querySelectorAll('#lang-switch .lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });
}

document.querySelectorAll('#lang-switch .lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLang(btn.getAttribute('data-lang')));
});

applyLang(currentLang);

const form = document.getElementById('feedback-form');
const errorMsg = document.getElementById('error-msg');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = document.getElementById('message').value.trim();
  if (!message) {
    errorMsg.classList.add('show');
    return;
  }
  errorMsg.classList.remove('show');
  submitBtn.disabled = true;

  try {
    const res = await fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        language: currentLang,
        category: document.getElementById('category').value,
        message: message,
        contact: document.getElementById('contact').value.trim()
      })
    });
    if (!res.ok) throw new Error('submit_failed');

    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').classList.add('show');
  } catch (err) {
    errorMsg.textContent = STRINGS[currentLang].errorEmpty;
    errorMsg.classList.add('show');
  } finally {
    submitBtn.disabled = false;
  }
});

document.getElementById('another-btn').addEventListener('click', () => {
  form.reset();
  document.getElementById('success-card').classList.remove('show');
  document.getElementById('form-card').style.display = 'block';
});
</script>
