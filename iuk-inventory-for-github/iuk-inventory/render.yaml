services:
  - type: web
    name: iuk-inventory
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
    disk:
      name: iuk-inventory-data
      mountPath: /var/data
      sizeGB: 1
