<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — IUK Inventory Management System</title>
<style>
  :root {
    --navy: #08305B;
    --navy-dark: #051d38;
    --gold: #C9A24B;
    --bg: #eef1f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 55%, #021224 100%);
    padding: 1.5rem;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    width: 100%;
    max-width: 400px;
    padding: 2.5rem 2.25rem 2rem;
  }
  .crest {
    width: 72px;
    height: 72px;
    margin: 0 auto 1rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--navy), var(--navy-dark));
    border: 3px solid var(--gold);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gold);
    font-weight: 700;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
  }
  h1 {
    text-align: center;
    font-size: 1.15rem;
    color: var(--navy);
    margin: 0 0 0.15rem;
    line-height: 1.4;
  }
  .subtitle {
    text-align: center;
    color: #6b7280;
    font-size: 0.85rem;
    margin-bottom: 1.75rem;
  }
  label {
    display: block;
    font-size: 0.82rem;
    color: #374151;
    font-weight: 600;
    margin-bottom: 0.3rem;
  }
  .field { margin-bottom: 1.1rem; }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 0.65rem 0.8rem;
    border: 1.5px solid #d1d5db;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type=text]:focus, input[type=password]:focus {
    border-color: var(--navy);
  }
  button {
    width: 100%;
    padding: 0.75rem;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 0.4rem;
  }
  button:hover { background: var(--navy-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    display: none;
  }
  .error.show { display: block; }
  .footer-note {
    text-align: center;
    color: #9ca3af;
    font-size: 0.75rem;
    margin-top: 1.5rem;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="crest">IUK</div>
    <h1>Islamic University of Kenya</h1>
    <div class="subtitle">Inventory Management System</div>

    <div class="error" id="error-box"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-btn">Sign In</button>
    </form>

    <div class="footer-note">Authorized staff only &middot; IUK Administration</div>
  </div>
  <script src="login.js"></script>
</body>
</html>
